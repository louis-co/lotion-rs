[package]
name = "lotion-rs"
version = "0.2.4"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.10"
tauri = { version = "2.0", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.0"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4"] }
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
toml = "0.8"
dirs = "5.0"
fluent = "0.16"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.0", features = ["test"] }

# macOS uses WKWebView's native (NSSpellChecker) spell checking, so Hunspell is
# only linked on Linux/Windows. This also removes the libclang/bindgen build
# requirement on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
hunspell-rs = "0.4.0"

# Same version wry already links; used for WKWebView APIs Tauri doesn't wrap
# (reloadFromOrigin).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.182"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_SystemInformation"
] }
